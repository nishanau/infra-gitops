# ------------------------------------------------------------
# Secret: cloudflared-credentials
# Purpose:
#   Stores the tunnel token provided by Cloudflare.
#   The actual value should never be committed to Git.
# ------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-credentials
  namespace: cloudflared
type: Opaque
stringData:
  tunnel-token: ""  # Leave blank here; inject manually

# ------------------------------------------------------------
# Cloudflared container specification
# ------------------------------------------------------------
containers:
  - name: cloudflared                   # Logical name for the container
    image: cloudflare/cloudflared:latest  # Official Cloudflare connector image
    imagePullPolicy: Always             # Always pull latest to stay updated with connector fixes

    # --------------------------------------------------------
    # Runtime arguments:
    #   cloudflared tunnel --no-autoupdate run --token $(TUNNEL_TOKEN)
    #
    # Explanation:
    #   - "tunnel" starts the Cloudflare Tunnel CLI mode.
    #   - "--no-autoupdate" disables the built-in auto-updater
    #     (best practice for containerized environments where updates
    #     are managed via image version control, not in-place updates).
    #   - "run" launches the tunnel connection process.
    #   - "--token" followed by $(TUNNEL_TOKEN) provides the
    #     Cloudflare-issued authentication token used to bind this
    #     connector instance to your specific Cloudflare Tunnel.
    # --------------------------------------------------------
    args:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - $(TUNNEL_TOKEN)

    # --------------------------------------------------------
    # Environment variable:
    #   TUNNEL_TOKEN
    #
    # Explanation:
    #   - The token is stored securely in a Kubernetes Secret
    #     (cloudflared-credentials) and injected at runtime.
    #   - The token identifies and authorizes this connector with
    #     Cloudflare’s Zero Trust infrastructure.
    # --------------------------------------------------------
    env:
      - name: TUNNEL_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflared-credentials   # Reference to the Kubernetes Secret object
            key: tunnel-token               # Key within the Secret containing the token value

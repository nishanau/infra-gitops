apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../base
  - infra-project.yaml
  - apps/infra-apps/external-secrets-app.yaml
  - apps/infra-apps/cloudflared-app.yaml
  - apps/infra-apps/ingress-nginx-app.yaml
  - apps/infra-apps/monitoring-app.yaml
  - apps/next-portfolio/prod-app.yaml
  - apps/next-portfolio/stage-app.yaml
  - apps/next-portfolio/dev-app.yaml

patches:
  - path: argocd-server-lb-patch.yaml
    target:
      group: v1
      version: v1
      kind: Service
      name: argocd-server

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: repo-server-sops-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: argocd-repo-server
      namespace: argocd

  - path: argocd-server-lb-patch.yaml
    target:
      group: v1
      version: v1
      kind: Service
      name: argocd-server
      namespace: argocd

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-prod-app
  namespace: prod
spec:
  project: portfolio-apps
  source:
    repoURL: https://github.com/nishanau/NextJSPortfolioSite.git
    path: manifests/overlays/prod
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s

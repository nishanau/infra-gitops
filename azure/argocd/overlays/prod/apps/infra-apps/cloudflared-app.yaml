apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: infra
  source:
    repoURL: https://github.com/nishanau/infra-gitops.git
    targetRevision: main
    path: cloudflared/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - kind: Secret
      name: cloudflared-credentials
      namespace: cloudflared
      jsonPointers:
        - /data
        - /stringData
        - /sops
